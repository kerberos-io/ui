name: Publish to npm
on: 
  push:
    branches:
        - main
jobs:
  publish-to-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: 24.22.1
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm run build
      - uses: JS-DevTools/npm-publish@v1
        with:
          token: ${{ secrets.NPM_TOKEN }}
